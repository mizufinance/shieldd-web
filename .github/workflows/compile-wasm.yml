name: Compile WASM
on:
  workflow_call:
  workflow_dispatch:

# CI exercises development keys; package publishing keeps the release approval gate.
env:
  SHIELDD_BUILD_PROFILE: dev
  CARGO_BUILD_JOBS: 2
  RAYON_NUM_THREADS: 2

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup nix
        uses: ./.github/actions/setup-nix
        # Optional: override default parameters
        # with:
        #   backend: 'github'
      #
      - name: setup turbo
        uses: ./.github/actions/setup-turbo

      - name: build the project
        run: nix develop --command just build

      - name: Verify no unexpected file changes (like cargo.lock change)
        run: git diff --exit-code

      - name: dump rust dependencies for debugging, only on failure
        run: nix develop --command cargo tree --invert shieldd-wasm --edges features
        if: failure()
        working-directory: packages/wasm/crate
