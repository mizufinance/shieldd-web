name: Bankd WASM
on:
  workflow_dispatch:
  push:
    branches: [codex/bankd-shieldd-wasm-sync]
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Orbis seed-binding bridge
        run: node --test packages/wasm/tests/orbis-bridge.test.mjs
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/wasm/crate
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Compile tracked browser source
        working-directory: packages/wasm/crate
        run: wasm-pack build --no-pack --target web --out-name index --out-dir ../wasm --no-opt
      - name: Check dependency lock
        run: git diff --exit-code -- packages/wasm/crate/Cargo.lock
      - name: Verify shipped admin API vectors
        run: node packages/wasm/tests/admin-api.mjs
      - name: Record source revisions
        run: |
          git rev-parse HEAD > packages/wasm/wasm/source-revision.txt
          git -C vendor/shieldd rev-parse HEAD > packages/wasm/wasm/shieldd-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bankd-wasm
          path: |
            packages/wasm/wasm/
            packages/wasm/crate/Cargo.lock
